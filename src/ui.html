<div class="shell">
  <header class="toolbar" aria-label="PEW controls">
    <div class="toolbar-controls">
      <div id="drag-handle" class="drag-handle" data-tauri-drag-region title="Drag PEW">
        <img
          class="toolbar-logo"
          src="/brand/pew-mark.svg"
          alt=""
          width="22"
          height="22"
          data-tauri-drag-region
          draggable="false"
        />
        <span class="toolbar-brand" data-tauri-drag-region>PEW<span>.</span></span>
      </div>
      <nav class="navigation control-group" aria-label="Page navigation">
        <button
          id="back-button"
          class="tool-button"
          type="button"
          aria-label="Go back"
          title="Back · Alt+Left"
          disabled
        >
          <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <button
          id="forward-button"
          class="tool-button"
          type="button"
          aria-label="Go forward"
          title="Forward · Alt+Right"
          disabled
        >
          <i data-lucide="arrow-right" aria-hidden="true"></i>
        </button>
        <button
          id="home-button"
          class="tool-button"
          type="button"
          aria-label="Go to start screen"
          title="Start screen"
          disabled
        >
          <i data-lucide="house" aria-hidden="true"></i>
        </button>
        <button
          id="reload-button"
          class="tool-button"
          type="button"
          aria-label="Reload"
          title="Reload · Ctrl+R"
          disabled
        >
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
        </button>
        <button
          id="stop-button"
          class="tool-button"
          type="button"
          aria-label="Stop loading"
          title="Stop loading · Esc"
          hidden
        >
          <i data-lucide="square" aria-hidden="true"></i>
        </button>
      </nav>
      <div class="device-tools control-group" role="group" aria-label="Preview tools">
        <button
          id="rotate-button"
          class="tool-button"
          type="button"
          aria-label="Rotate to landscape"
          title="Rotate to landscape"
          aria-pressed="false"
        >
          <i data-lucide="rotate-cw-square" aria-hidden="true"></i>
        </button>
        <button
          id="screenshot-button"
          class="tool-button"
          type="button"
          aria-label="Save screenshot"
          title="Save screenshot"
          disabled
        >
          <i data-lucide="camera" aria-hidden="true"></i>
        </button>
      </div>
      <div class="window-actions control-group" role="group" aria-label="Window controls">
        <button
          id="minimize-button"
          class="window-button"
          type="button"
          aria-label="Minimize"
          title="Minimize"
        >
          <i data-lucide="minus" aria-hidden="true"></i>
        </button>
        <button
          id="close-button"
          class="window-button close-button"
          type="button"
          aria-label="Close"
          title="Close"
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <form id="address-form" class="address-bar" autocomplete="off">
      <i data-lucide="globe" class="address-icon" aria-hidden="true"></i>
      <input
        id="address-input"
        type="text"
        inputmode="url"
        spellcheck="false"
        autocapitalize="off"
        aria-label="Website URL"
        aria-describedby="address-status"
        placeholder="Website or localhost:3000"
        autofocus
      />
      <button
        id="recent-button"
        class="recent-toggle"
        type="button"
        aria-label="Recent URLs"
        aria-expanded="false"
        aria-controls="recent-section"
        title="Recent URLs"
      >
        <i data-lucide="chevron-down" aria-hidden="true"></i>
      </button>
      <button
        id="address-go"
        class="address-go"
        type="submit"
        aria-label="Open website"
        title="Open website · Enter"
      >
        <i data-lucide="arrow-right" aria-hidden="true"></i>
      </button>
    </form>
    <section id="recent-section" class="recent-section" aria-label="Recent URLs" hidden>
      <div class="recent-heading">
        <span>Recent URLs</span><button id="clear-recent" type="button">Clear</button>
      </div>
      <ul id="recent-list"></ul>
      <p id="recent-empty">Websites you open will appear here.</p>
    </section>
    <form
      id="viewport-panel"
      class="viewport-panel"
      aria-label="Viewport settings"
      novalidate
      hidden
    >
      <div class="panel-heading">
        <span>Viewport settings</span>
        <button
          id="close-viewport"
          type="button"
          aria-label="Close viewport settings"
          title="Close viewport settings"
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <label class="preset-label" for="viewport-preset">Preset</label>
      <select id="viewport-preset" aria-label="Viewport preset"></select>
      <div class="viewport-fields">
        <label
          >Width
          <input
            id="viewport-width"
            type="number"
            min="240"
            max="1920"
            step="1"
            inputmode="numeric"
            required
        /></label>
        <label
          >Height
          <input
            id="viewport-height"
            type="number"
            min="240"
            max="1920"
            step="1"
            inputmode="numeric"
            required
        /></label>
        <label
          >Density
          <select id="viewport-density">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
          </select></label
        >
      </div>
      <p id="viewport-error" class="viewport-error" role="alert" hidden></p>
      <div class="viewport-actions">
        <button id="reset-viewport" type="button">Reset</button
        ><button id="apply-viewport" type="submit">Apply viewport</button>
      </div>
    </form>
    <div class="status-row">
      <div id="preview-status" class="preview-status">
        <span id="address-status" class="address-status" role="status" aria-live="polite"
          >Mobile preview</span
        >
        <button
          id="viewport-size"
          class="viewport-size"
          type="button"
          title="Viewport settings · size, pixel density, and display scale"
          aria-label="Viewport settings"
          aria-expanded="false"
          aria-controls="viewport-panel"
        ></button>
      </div>
      <div id="notice" class="notice" data-kind="error" hidden>
        <span id="notice-text" role="alert"></span>
        <button id="notice-action" class="notice-action" type="button" hidden></button>
        <button
          id="dismiss-notice"
          class="dismiss-notice"
          type="button"
          aria-label="Dismiss message"
          title="Dismiss message"
        >
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="load-progress" aria-hidden="true"><span></span></div>
  </header>
  <div class="device-stage">
    <div class="device-scale">
      <main class="phone" aria-label="Phone preview">
        <div class="phone-speaker" aria-hidden="true"></div>
        <span class="phone-side-button phone-side-button--volume-up" aria-hidden="true"></span>
        <span class="phone-side-button phone-side-button--volume-down" aria-hidden="true"></span>
        <span class="phone-side-button phone-side-button--power" aria-hidden="true"></span>
        <div id="site-viewport" class="site-viewport">
          <div id="empty-state" class="empty-state">
            <div class="welcome">
              <div class="welcome-mark" aria-hidden="true"><i data-lucide="smartphone"></i></div>
              <h1>Open a website</h1>
              <p>Enter a website or local project in the address bar above.</p>
              <button id="focus-address" class="welcome-action" type="button">
                Enter an address <kbd>Ctrl L</kbd>
              </button>
            </div>
          </div>
          <div id="loading-state" class="loading-state" hidden>
            <span class="loading-spinner" aria-hidden="true"></span><span>Opening website…</span>
          </div>
        </div>
        <div class="phone-home-indicator" aria-hidden="true"></div>
      </main>
    </div>
  </div>
</div>
