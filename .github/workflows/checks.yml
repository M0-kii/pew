name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: pnpm format:check
      - run: pnpm build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm test
        env:
          PEW_NATIVE_TEST: '1'
          PEW_TEST_ARTIFACT_DIR: ${{ runner.temp }}/pew-test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: test-results
          path: ${{ runner.temp }}/pew-test-results
          if-no-files-found: ignore
